<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &bull; GovFix Municipal Portal</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            color: #f8fafc;
        }
        .login-card {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .login-header {
            background: #1e3a8a;
            color: #ffffff;
            padding: 28px 24px 24px;
            text-align: center;
            border-bottom: 4px solid #3b82f6;
        }
        .login-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .login-header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #bfdbfe;
        }
        .login-body {
            padding: 28px 24px 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.15s ease;
        }
        .form-control:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .links-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 13px;
        }
        .links-row a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        .links-row a:hover {
            text-decoration: underline;
        }
        .demo-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .demo-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .demo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-demo {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-demo:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }
        .btn-demo span {
            display: block;
            color: #64748b;
            font-size: 10px;
            font-weight: 400;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #f87171;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .alert-info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #93c5fd;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>GovFix Municipal Portal</h1>
            <p>Official Grievance Redressal &amp; Governance System</p>
        </div>
        <div class="login-body">
            <div id="alert-error" class="alert-error"></div>
            <div id="alert-info" class="alert-info"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@domain.gov / citizen@mail" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
                </div>
                <button type="submit" id="btn-submit" class="btn-submit">Sign In to Dashboard</button>
            </form>

            <div class="links-row">
                <a href="/forgot-password">Forgot password?</a>
                <a href="/signup">New citizen? Register here &rarr;</a>
            </div>

            <div class="demo-section">
                <div class="demo-title">
                    <span>⚡ Quick Demo Logins</span>
                    <span style="font-weight: normal; color: #94a3b8;">(Pwd: GovFix2026!)</span>
                </div>
                <div class="demo-grid">
                    <button type="button" class="btn-demo" onclick="quickLogin('citizen1@govfix.local', 'Citizen 1 (Ramesh)')">
                        Citizen 1
                        <span>citizen1@govfix.local</span>
                    </button>
                    <button type="button" class="btn-demo" onclick="quickLogin('citizen2@govfix.local', 'Citizen 2 (Priya)')">
                        Citizen 2 (Isolation)
                        <span>citizen2@govfix.local</span>
                    </button>
                    <button type="button" class="btn-demo" onclick="quickLogin('triage@govfix.local', 'Triage Officer Anil')">
                        Triage Desk
                        <span>triage@govfix.local</span>
                    </button>
                    <button type="button" class="btn-demo" onclick="quickLogin('field1@govfix.local', 'Field Officer Vikram')">
                        Field Officer 1
                        <span>field1@govfix.local</span>
                    </button>
                    <button type="button" class="btn-demo" onclick="quickLogin('field2@govfix.local', 'Field Officer Sunita')">
                        Field Officer 2
                        <span>field2@govfix.local</span>
                    </button>
                    <button type="button" class="btn-demo" onclick="quickLogin('supervisor@govfix.local', 'Supervisor Rajesh')">
                        Supervisor
                        <span>supervisor@govfix.local</span>
                    </button>
                    <button type="button" class="btn-demo" onclick="quickLogin('audit@govfix.local', 'Inspector Meera')">
                        Audit Inspector
                        <span>audit@govfix.local</span>
                    </button>
                    <button type="button" class="btn-demo" onclick="quickLogin('admin@govfix.local', 'Administrator')">
                        Administrator
                        <span>admin@govfix.local</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHARED_DEMO_PASSWORD = "GovFix2026!";

        function showError(msg) {
            const el = document.getElementById("alert-error");
            el.textContent = msg;
            el.style.display = "block";
        }

        function showInfo(msg) {
            const el = document.getElementById("alert-info");
            el.textContent = msg;
            el.style.display = "block";
        }

        function clearAlerts() {
            document.getElementById("alert-error").style.display = "none";
            document.getElementById("alert-info").style.display = "none";
        }

        function quickLogin(email, label) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = SHARED_DEMO_PASSWORD;
            clearAlerts();
            showInfo(`Selected ${label}. Signing in...`);
            handleLogin(email, SHARED_DEMO_PASSWORD);
        }

        async function handleLogin(email, password) {
            const btn = document.getElementById("btn-submit");
            btn.disabled = true;
            btn.textContent = "Authenticating...";

            try {
                // Generate dev/emulator token or auth token
                const token = "mock-token-" + encodeURIComponent(email);

                // 1. Establish backend session cookie
                const sessionResp = await fetch("/api/v1/auth/session", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token })
                });

                if (!sessionResp.ok) {
                    throw new Error("Failed to initialize session.");
                }

                // 2. Fetch authoritative user profile from database
                const profileResp = await fetch("/api/v1/auth/me", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!profileResp.ok) {
                    const err = await profileResp.json();
                    throw new Error(err.detail || "Authentication failed.");
                }

                const profileData = await profileResp.json();
                const user = profileData.data;

                // Store token in localStorage for API calls
                localStorage.setItem("govfix_token", token);
                localStorage.setItem("govfix_user", JSON.stringify(user));

                // 3. Role-based redirect
                let dest = "/citizen";
                if (user.role === "Citizen") dest = "/citizen";
                else if (user.role === "Officer") dest = "/staff/triage";
                else if (user.role === "Field Officer") dest = "/staff/field";
                else if (user.role === "Supervisor") dest = "/staff/supervisor";
                else if (user.role === "Audit Inspector") dest = "/staff/audit";
                else if (user.role === "Admin") dest = "/admin";

                window.location.href = dest;
            } catch (err) {
                btn.disabled = false;
                btn.textContent = "Sign In to Dashboard";
                showError(err.message || "Sign in failed. Check credentials.");
            }
        }

        document.getElementById("login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            clearAlerts();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            handleLogin(email, password);
        });

        // Check if session expired
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("expired")) {
            showInfo("Your session has expired. Please sign in again.");
        }
    </script>
</body>
</html>

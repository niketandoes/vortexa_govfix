<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password &bull; GovFix Municipal Portal</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            color: #f8fafc;
        }
        .card {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .header {
            background: #1e3a8a;
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
            border-bottom: 4px solid #3b82f6;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }
        .header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #bfdbfe;
        }
        .body {
            padding: 28px 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #86efac;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Password Recovery</h1>
            <p>GovFix Municipal Grievance Redressal</p>
        </div>
        <div class="body">
            <div id="alert-success" class="alert-success"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="email">Registered Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="citizen@example.com / officer@municipality.gov" required>
                </div>
                <button type="submit" id="btn-submit" class="btn-submit">Dispatch Password Reset Link</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 13px;">
                <a href="/login" style="color: #2563eb; text-decoration: none; font-weight: 600;">&larr; Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("reset-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("btn-submit");
            btn.disabled = true;
            btn.textContent = "Dispatching Link...";

            try {
                const resp = await fetch("/api/v1/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const data = await resp.json();
                document.getElementById("alert-success").textContent = data.message || "Password reset email dispatched.";
                document.getElementById("alert-success").style.display = "block";
                document.getElementById("reset-form").style.display = "none";
            } catch (err) {
                btn.disabled = false;
                btn.textContent = "Dispatch Password Reset Link";
                alert("An error occurred. Please try again.");
            }
        });
    </script>
</body>
</html>
